// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'
    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.debug = true
    options.debugOptions.debugLevel = 'source,lines'
}

tasks.withType(Zip).configureEach {
    entryCompression = ZipEntryCompression.STORED
}

tasks.named('test', Test).configure {
    def exactJar = providers.gradleProperty('enderIoJar')
    if (exactJar.isPresent()) {
        systemProperty 'enderIoJar', exactJar.get()
    }
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.enderio',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-enderio-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-enderio-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-enderio-addon.md' }
    }
    from('provenance/upstreams.json') { into 'META-INF/bluemap-enderio' }
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-enderio-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-enderio-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-enderio-addon.md' }
    }
    from('provenance/upstreams.json') { into 'META-INF/bluemap-enderio' }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }

tasks.register('verifyPinnedArtifact') {
    def exactJar = providers.gradleProperty('enderIoJar')
    if (exactJar.isPresent()) {
        inputs.file(exactJar)
    }
    doLast {
        if (!exactJar.isPresent()) {
            throw new GradleException(
                    'Set -PenderIoJar to the exact All the Mons 1.2.0 Ender IO JAR.'
            )
        }
        def jarFile = file(exactJar.get())
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(jarFile.bytes).encodeHex().toString()
        if (jarFile.length() != 6592813L
                || digest != 'e01af48907781f2d5ccdfa8d71975b611c33f295be11b7021cb91be06ce8070c') {
            throw new GradleException(
                    "Pinned Ender IO artifact mismatch: ${jarFile.length()} bytes, ${digest}"
            )
        }
    }
}

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'assets/bluemap_enderio/blockstates/painted_redstone.json',
                    'bluemap-enderio/profiles/enderio/8.2.11-beta/profile.json',
                    'META-INF/LICENSE-bluemap-enderio-addon',
                    'META-INF/NOTICE-bluemap-enderio-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-enderio-addon.md',
                    'META-INF/bluemap-enderio/upstreams.json'
            ]
            def missing = required.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Production JAR is missing: ${missing}")
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint != 'io.github.janguenter.bluemap.enderio.BlueMapEnderIoAddon'
                    || addon.dependencies != [] || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('com/enderio/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('assets/enderio/')
                        || it.endsWith('.png')
                        || it.endsWith('.mcmeta')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/enderio/BlueMapEnderIoAddon.java',
                    'io/github/janguenter/bluemap/enderio/adapter/bluemap522/EnderIoPaintedBlockRenderer.java',
                    'bluemap.addon.json',
                    'assets/bluemap_enderio/blockstates/painted_redstone.json',
                    'bluemap-enderio/profiles/enderio/8.2.11-beta/profile.json',
                    'META-INF/LICENSE-bluemap-enderio-addon',
                    'META-INF/NOTICE-bluemap-enderio-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-enderio-addon.md',
                    'META-INF/bluemap-enderio/upstreams.json'
            ]
            def missing = required.findAll { !entries.contains(it) }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/enderio/')
            }
            def forbidden = entries.findAll {
                it.endsWith('.class')
                        || it.endsWith('.jar')
                        || it.endsWith('.png')
                        || it.startsWith('assets/enderio/')
                        || it.startsWith('com/enderio/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('gallery/')
            }
            if (!missing.isEmpty()
                    || projectJava.isEmpty()
                    || !foreignJava.isEmpty()
                    || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: missing=${missing}, "
                                + "foreignJava=${foreignJava}, forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

def verifyAcceptedFile = { File candidate, String sizeProperty, String hashProperty ->
    def expectedSize = providers.gradleProperty(sizeProperty).get().toLong()
    def expectedSha256 = providers.gradleProperty(hashProperty).get()
    if (expectedSize <= 0 || expectedSha256 == 'PENDING') {
        throw new GradleException("Release identity ${sizeProperty}/${hashProperty} is unsealed")
    }
    def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
            .digest(candidate.bytes)
            .encodeHex()
            .toString()
    if (candidate.length() != expectedSize || actualSha256 != expectedSha256) {
        throw new GradleException(
                "Accepted artifact mismatch for ${candidate}: "
                        + "${candidate.length()} bytes, SHA-256 ${actualSha256}"
        )
    }
}

tasks.register('verifyAcceptedProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        verifyAcceptedFile(
                inputs.files.singleFile,
                'accepted_jar_size',
                'accepted_jar_sha256'
        )
    }
}

tasks.register('verifyAcceptedSourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        verifyAcceptedFile(
                inputs.files.singleFile,
                'accepted_sources_jar_size',
                'accepted_sources_jar_sha256'
        )
    }
}

tasks.register('verifyStagedEquivalence', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3', 'tools/verify_staged_equivalence.py',
                '--jar', productionJar.get().asFile,
                '--entries', 'provenance/accepted-staging-entries.sha256'
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyPinnedArtifact')
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPublicationArtifacts') {
    dependsOn tasks.named('generatePomFileForAddonPublication')
    dependsOn tasks.named('generateMetadataFileForAddonPublication')
    doLast {
        verifyAcceptedFile(
                file('build/publications/addon/pom-default.xml'),
                'accepted_pom_size',
                'accepted_pom_sha256'
        )
        verifyAcceptedFile(
                file('build/publications/addon/module.json'),
                'accepted_module_size',
                'accepted_module_sha256'
        )
        def pom = file('build/publications/addon/pom-default.xml').text
        def module = new groovy.json.JsonSlurper()
                .parse(file('build/publications/addon/module.json'))
        if (!pom.contains("<version>${project.version}</version>")
                || module.component.version != project.version.toString()
                || project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException('Publication metadata is not the final release version')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    doLast {
        def expectedTag = "v${project.version}"
        def requestedTag = providers.gradleProperty('releaseTag').getOrElse('')
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException('Release versions must not end in -SNAPSHOT')
        }
        if (requestedTag != expectedTag) {
            throw new GradleException(
                    "Release tag mismatch: ${requestedTag ?: '<unset>'} != ${expectedTag}"
            )
        }
        def release = new groovy.json.JsonSlurper()
                .parse(file('provenance/release.json'))
        if (release.status != 'owner-accepted-release-candidate'
                || release.version != project.version.toString()
                || release.owner_accepted_staging == null
                || release.final_release_artifacts == null) {
            throw new GradleException('Release provenance is not sealed')
        }
        def expectedArtifacts = [
                production_jar: [
                        file_name: "${artifact_id}-${project.version}.jar",
                        size: providers.gradleProperty('accepted_jar_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_jar_sha256').get()
                ],
                sources_jar: [
                        file_name: "${artifact_id}-${project.version}-sources.jar",
                        size: providers.gradleProperty('accepted_sources_jar_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_sources_jar_sha256').get()
                ],
                pom: [
                        file_name: "${artifact_id}-${project.version}.pom",
                        size: providers.gradleProperty('accepted_pom_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_pom_sha256').get()
                ],
                gradle_module: [
                        file_name: "${artifact_id}-${project.version}.module.json",
                        size: providers.gradleProperty('accepted_module_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_module_sha256').get()
                ]
        ]
        expectedArtifacts.each { name, identity ->
            if (release.final_release_artifacts[name] != identity) {
                throw new GradleException(
                        "Release provenance mismatch for ${name}: "
                                + "${release.final_release_artifacts[name]} != ${identity}"
                )
            }
        }
    }
}

tasks.register('verifyReleaseCandidate') {
    dependsOn tasks.named('check')
    dependsOn tasks.named('verifyAcceptedProductionJar')
    dependsOn tasks.named('verifyAcceptedSourcesJar')
    dependsOn tasks.named('verifyStagedEquivalence')
    dependsOn tasks.named('verifyPublicationArtifacts')
    dependsOn tasks.named('verifyReleaseMetadata')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for Ender IO painted redstone blocks.'
                url = 'https://github.com/jan-guenter/bluemap-enderio-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-enderio-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-enderio-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-enderio-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
