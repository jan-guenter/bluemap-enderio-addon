name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read final release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact BlueMap 5.23 feature backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "7e07f4e74ec1e92a6ead9aa1e66054af3e133aac"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Acquire exact ephemeral Ender IO input
        run: |
          input_dir="${RUNNER_TEMP}/enderio-input"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/enderio-8.2.11-beta.jar" \
            "https://www.curseforge.com/api/v1/mods/64578/files/8192838/download"
          test "$(stat -c %s \
            "${input_dir}/enderio-8.2.11-beta.jar")" -eq 6592813
          sha256sum --check <<SHA256SUMS
          e01af48907781f2d5ccdfa8d71975b611c33f295be11b7021cb91be06ce8070c  ${input_dir}/enderio-8.2.11-beta.jar
          SHA256SUMS

      - name: Verify gallery and provenance inputs
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          python3 gallery/lint.py
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-first.zip"
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-second.zip"
          cmp "${RUNNER_TEMP}/gallery-first.zip" \
            "${RUNNER_TEMP}/gallery-second.zip"
          test "$(stat -c %s "${RUNNER_TEMP}/gallery-first.zip")" -eq 2732
          sha256sum --check <<SHA256SUMS
          02e7cfe845645197911d3bf7e15334c4771b81d8450b0db7beda40abaac3d2e6  ${RUNNER_TEMP}/gallery-first.zip
          SHA256SUMS

      - name: Build and verify final release candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          input_dir="${RUNNER_TEMP}/enderio-input"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PenderIoJar="${input_dir}/enderio-8.2.11-beta.jar" \
            "-PreleaseTag=v${VERSION}" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication \
            verifyPublicationArtifacts verifyReleaseCandidate
          test "$(stat -c %s \
            "build/libs/bluemap-enderio-addon-${VERSION}.jar")" -eq 67131
          test "$(stat -c %s \
            "build/libs/bluemap-enderio-addon-${VERSION}-sources.jar")" -eq 51775
          test "$(stat -c %s build/publications/addon/pom-default.xml)" -eq 1343
          test "$(stat -c %s build/publications/addon/module.json)" -eq 2817
          sha256sum --check <<SHA256SUMS
          2f7b61a7bdd53bc5cce8181e2575e31b681d26ea734c9e6563c1af7c0fee7d1c  build/libs/bluemap-enderio-addon-${VERSION}.jar
          e83cf1420e27fbc5e9cd1df2ed0c5f27bc6ca8974867eb3b33cc501ad8da1646  build/libs/bluemap-enderio-addon-${VERSION}-sources.jar
          6cdc740cbaf72cade03c7107bb002878eb9a2035dcf36770fe38876c269a91df  build/publications/addon/pom-default.xml
          e3e231410f6cc441f28175e84ac1e7b56448d3551ad122d1be8b3a0e1821ed59  build/publications/addon/module.json
          SHA256SUMS
          PYTHONPATH=tooling/bluemap-addon-toolkit/src \
            python3 -m bluemap_addon_toolkit jar-entries verify \
            --jar "build/libs/bluemap-enderio-addon-${VERSION}.jar" \
            --entries provenance/accepted-staging-entries.sha256 \
            --expected-version "${VERSION}"

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-enderio-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-enderio-failure-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/*.xml
            build/publications/addon/*.json
            build/reports/**
          if-no-files-found: warn
          retention-days: 3
